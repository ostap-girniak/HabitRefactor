<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitRefactor — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0F;
      color: #F0F0F5;
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 380px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255, 77, 0, 0.3);
    }
    .icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #FF4D00, #FF8C00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      color: #8888AA;
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #FF4D00, #FF8C00);
      color: white;
      font-weight: 700;
      padding: 0.75rem 2rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: transform 150ms, box-shadow 150ms;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(255, 77, 0, 0.4);
    }
    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .status {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #555570;
    }
    .status span { color: #FF8C00; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <img src="/icons/icon-192.png" alt="HabitRefactor" />
    </div>
    <h1>You're Offline</h1>
    <p>
      No connection? No excuses. The forge doesn't stop because the network went dark.
      Reconnect and get back to work.
    </p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <div class="status pulse">
      <span>●</span> Waiting for connection...
    </div>
  </div>
  <script>
    // Auto-reload when back online
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
